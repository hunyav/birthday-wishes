<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Ramona a Birthday Wish</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="form-page">
      <section class="form-card">
        <h1>Send Ramona a Birthday Wish 🎉</h1>
        <p>Share your message and it will appear on the celebration screen shortly.</p>

        <form id="wishForm">
          <label for="name">Your Name</label>
          <input id="name" name="name" maxlength="80" required />

          <label for="message">Your Birthday Wish</label>
          <textarea id="message" name="message" maxlength="500" required></textarea>

          <button type="submit">Submit Wish</button>
        </form>

        <p class="status" id="status"></p>
      </section>
    </div>

    <script src="/submit.js" defer></script>
  </body>
</html>
